<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="cs-token" content="__CS_TOKEN__" />
    <meta name="cs-version" content="__CS_VERSION__" />
    <!-- 主题引导必须排在样式表之前。
         外壳（lib/client.js）把宿主的明/暗结论用 ?theme=light|dark 传进来，这里把它落到
         <html data-theme>，app.css 才切得动配色；直连 /cs/（没有参数）时交给
         prefers-color-scheme 兜底。放在 <link> 之前是为了暗色下不闪一帧白底。 -->
    <script>
      (function () {
        try {
          var theme = new URLSearchParams(location.search).get('theme');
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (error) {
          /* 取不到就跟随系统配色 */
        }
      })();
    </script>
    <!-- 用 <base> 固定相对地址的解析基准，这样 /cs 与 /cs/ 两种访问方式下
         fetch("api/health") 与 import("./page-x.js") 都会落到正确的前缀上。 -->
    <base href="__CS_PREFIX__/" />
    <title>客服控制台</title>
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="stylesheet" href="./app.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-left">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a8 8 0 0 1 16 0" /><rect x="1.5" y="10" width="5" height="7" rx="2.5" /><rect x="17.5" y="10" width="5" height="7" rx="2.5" /><path d="M20 17v1.5a3 3 0 0 1-3 3h-3.5" /></svg>
          </span>
          <span class="brand-text">
            <span class="brand-title">客服控制台</span>
            <span class="brand-version" id="version">__CS_VERSION__</span>
          </span>
        </div>
        <nav class="mainnav" id="mainnav" aria-label="一级导航"></nav>
      </div>
      <div class="topbar-actions">
        <button type="button" class="btn" id="refresh" title="立即刷新当前页">
          <svg class="btn-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 11a8.5 8.5 0 1 0-2.6 6.1" /><path d="M20.5 4.5V11h-6.4" /></svg>
          <span>刷新</span>
        </button>
        <label class="toggle" title="页面可见时每 60 秒自动刷新">
          <input type="checkbox" id="auto" checked />
          <span>自动刷新</span>
        </label>
        <a class="btn btn-ghost" href="./" target="_blank" rel="noreferrer" title="在新标签打开控制台" aria-label="在新标签打开控制台">
          <svg class="btn-glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6" /><path d="M20 4 11.5 12.5" /><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4" /></svg>
          <span>新标签</span>
        </a>
      </div>
    </header>

    <nav class="tabs subnav" id="subnav" hidden aria-label="二级页签"></nav>

    <main class="content" id="content"></main>

    <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
